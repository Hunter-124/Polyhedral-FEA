name: CI

on:
  push:
    branches: [master]
  pull_request:

# One live run per ref. Pushing four commits in a row otherwise queues four
# 13-minute cross-stdlib jobs that starve each other for runners, and only the
# last one's answer is about the tree anyone still has.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Core libraries + Catch2 suite. GUI is built too (X11-only GLFW) so
  # presentation code stays compiling, but tests only need libs.
  build-test:
    runs-on: ubuntu-latest
    # Measured ~26 min. A hang used to sit until GitHub's 6 h ceiling.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          # OCCT's imported targets link TBB; ubuntu-24.04 omits libtbb.so without -dev.
          # python3-numpy: six ctest cases re-derive advisor dataset rows by
          # importing scripts/build_advisor_dataset.py, which imports numpy. They
          # only started running once the build stopped failing ahead of them.
          sudo apt-get install -y --no-install-recommends \
            python3-numpy \
            ninja-build \
            cmake \
            g++ \
            clang-tidy \
            libeigen3-dev \
            nlohmann-json3-dev \
            libomp-dev \
            libtbb-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            xvfb \
            xauth \
            desktop-file-utils \
            appstream \
            libocct-data-exchange-dev \
            libocct-foundation-dev \
            libocct-modeling-algorithms-dev \
            libocct-modeling-data-dev \
            libocct-ocaf-dev \
            libocct-visualization-dev

      - name: Configure
        # RelWithDebInfo, not Debug. This suite is dominated by the mesher and
        # solver, and unoptimised they are not slow but impractical: measured in
        # a local Debug build at --parallel 4, `brep_fidelity: graded
        # authoritative curvature stays stiffness-valid` takes 1609 s, `sharp
        # BRep edges are reproduced by mesh feature segments` 1377 s, `boundary
        # nodes land on the exact BRep for every CAD mesher` 1298 s and the
        # graded plate-hole BRep test 761 s -- on a box faster than a runner.
        # The whole 451-test suite is 272 s optimised. A Debug run of it reached
        # GitHub's 6 h ceiling on 2026-08-19 and was killed with no result, which
        # is a gate that reports nothing rather than a strict one.
        #
        # Nothing is given up by optimising: the product path carries no
        # `assert()`, so -DNDEBUG removes no check, the validity gates are real
        # code that throws either way, and -O2 raises strictly more -W warnings
        # than -O0 for the -Werror build below. Debug info is kept so a failing
        # test still symbolises.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPOLYMESH_WITH_GUI=ON \
            -DPOLYMESH_WITH_OCC=ON \
            -DPOLYMESH_WITH_CUDA=OFF

      - name: Build (warnings are errors)
        timeout-minutes: 15
        run: cmake --build build

      - name: clang-tidy first-party sources
        timeout-minutes: 12
        run: |
          run-clang-tidy -p build -j 0 \
            '.*[/\\]Polyhedral-FEA[/\\](apps|src|tests)[/\\]'

      - name: Test
        timeout-minutes: 15
        # Working directory for discovered tests is the repo root (bench/reference).
        #
        # `--parallel 2` on a 4-vCPU runner left half the machine idle. Use the
        # cores the runner has, and bound each test well above its measured cost
        # rather than near it: the whole optimised suite is 272 s locally and the
        # slowest single test well under a minute, so 900 s is a hang, not a slow
        # test. Tuning a limit down to just above a measurement is how the poll
        # budgets in test_gui_pipeline came to fail a working mesher for being
        # slow rather than wrong.
        run: |
          ctest --test-dir build --output-on-failure \
            --parallel "$(nproc)" --timeout 900

      - name: Install and package smoke
        timeout-minutes: 8
        run: |
          cmake --install build --prefix "$PWD/build/stage"
          build/stage/bin/polymesh --version | grep -Fx "polymesh 0.1.1"
          build/stage/bin/polymesh backend
          desktop-file-validate \
            build/stage/share/applications/io.github.hunter124.PolyMesh.desktop
          appstreamcli validate --no-net \
            build/stage/share/metainfo/io.github.hunter124.PolyMesh.metainfo.xml
          xvfb-run -a env POLYMESH_GUI_SIZE=1280x800 \
            build/stage/bin/polymesh-gui \
            build/stage/share/polymesh/examples/unit_box.step \
            --auto "shot build/stage/gui-smoke.png; quit"
          test -s build/stage/gui-smoke.png
          cmake --build build --target package

  # Cross-standard-library determinism. The mesher once produced a different mesh
  # under MSVC than under gcc (5 of 24 corpus pairs, 2026-08-14) because several
  # hot loops iterated unordered_map/unordered_set and fed that order into node
  # relaxation, carve selection and DOF numbering. Floating point was not the
  # cause: -ffp-contract=off changed nothing. libc++ hashes and buckets
  # differently from libstdc++, so meshing the same part with both and diffing
  # the report is a direct guard against the order dependence coming back.
  cross-stdlib-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake g++ clang libc++-dev libc++abi-dev \
            libeigen3-dev nlohmann-json3-dev libomp-dev libtbb-dev \
            libfontconfig1-dev libfreetype-dev \
            libocct-data-exchange-dev libocct-foundation-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-ocaf-dev libocct-visualization-dev

      - name: Build with libstdc++
        run: |
          cmake -S . -B build-gnu -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPOLYMESH_WITH_GUI=OFF -DPOLYMESH_WITH_OCC=ON -DPOLYMESH_WITH_CUDA=OFF
          cmake --build build-gnu --target polymesh

      # Warnings are not errors here: libc++ raises a different -Wconversion set,
      # which has nothing to do with the property under test. The gcc job above
      # keeps -Werror.
      - name: Build with libc++
        run: |
          cmake -S . -B build-libcxx -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang \
            -DPOLYMESH_WITH_GUI=OFF -DPOLYMESH_WITH_OCC=ON -DPOLYMESH_WITH_CUDA=OFF \
            -DPOLYMESH_WERROR=OFF -DCMAKE_CXX_FLAGS="-stdlib=libc++ -w" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++"
          cmake --build build-libcxx --target polymesh

      - name: Same part, both standard libraries, identical mesh
        run: bash scripts/check_cross_stdlib_mesh.sh

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      # Pin clang-format so local + CI use the same style (apt versions drift).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: pip install 'clang-format==18.1.8'
      - name: clang-format check
        run: |
          clang-format --version
          mapfile -t files < <(find apps src tests \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.cu' \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C++ sources found"
            exit 1
          fi
          clang-format --dry-run --Werror "${files[@]}"

  grep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: No bench/reference reads outside the bench module
        run: |
          # Anti-cheat: product libraries + study apps must not load reference
          # answers. apps/bench and bench/ are allowed (competitive harness).
          if grep -rn "bench/reference" src/geom src/mesh src/adapt src/fea src/pipeline \
              apps/cli apps/gui; then
            echo "ERROR: bench/reference referenced outside src/bench / apps/bench"
            exit 1
          fi
          echo "grep-audit clean"
      - name: No product-path STL writers (ADR-0020 / V2d)
        run: bash scripts/check_no_product_stl.sh
